name: Update commit shares

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh commit bars
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_commit_bars.py
      - name: Commit README when the counts changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "Update commit shares."
          git push
